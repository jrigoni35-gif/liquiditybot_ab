# Tooling config. Kept minimal on purpose.

[tool.pytest.ini_options]
# --strict-markers: an unregistered or typo'd mark is a collection ERROR,
# never a silently-ignored no-op. Without it, a misspelled `timing` tag
# would quietly put a load-marginal test back into the battery's parallel
# pass - a gate hole with no visible failure.
addopts = "--strict-markers"
markers = [
    "timing: wall-clock-sensitive under CPU load. Excluded from the battery's parallel -n 8 pass and run in a follow-up SERIAL pass (test_windows.bat, owed item 44). Tag tests a saturated box can fail without a code defect: upper-bounded elapsed measurements, thread-gap spacing, hard wall timeouts on CPU-heavy subprocesses.",
    # --- foreign marks, declared so that strict may stay strict -------------
    # A globally-installed SuperClaude pytest plugin APPLIES four marks during
    # collection (unit / integration / hallucination / performance) while
    # registering only its own, different four. Under --strict-markers that
    # mismatch is not a warning and not one red test: pytest raises
    # INTERNALERROR mid-collection and NOTHING runs. Measured on this box
    # 2026-08-14 — "no tests ran in 4.28s". The entire definition-of-done
    # battery, silenced by a guest the repo never invited.
    #
    # Two easy doors, both refused. `-p no:superclaude` hides the guest
    # instead of housing it, and thereafter must be remembered by every
    # human, every lane, every future session — a fix that survives only by
    # being remembered is not a fix, it is a debt with a friendly face.
    # Loosening --strict-markers is worse: the note above it explains what
    # that strictness holds shut, and a typo'd `timing` slipping a
    # load-marginal test back into the parallel pass is a gate hole that
    # fails silently, which is the only kind that matters.
    #
    # So we name the guest. A mark that is declared is a mark that is meant.
    # These four are inert here — nothing in this repo selects or deselects
    # on them — and on the day the plugin is uninstalled they cost one dead
    # line apiece, which is a very small rent for a battery that runs.
    "unit: applied automatically by the SuperClaude pytest plugin at collection. Inert here; this repo's own selection never reads it.",
    "integration: applied automatically by the SuperClaude pytest plugin at collection. Inert here; this repo's own selection never reads it.",
    "hallucination: applied automatically by the SuperClaude pytest plugin at collection. Inert here; this repo's own selection never reads it.",
    "performance: applied automatically by the SuperClaude pytest plugin at collection. Inert here; this repo's own selection never reads it.",
]

[tool.ruff.lint]
# Defaults (E4,E7,E9,F) plus a curated breadth bump:
#   B    - bugbear: real bug classes (B905 zip strict, B904 raise-from,
#          B007 unused loop vars); the tree is clean under it.
#   C901 - mccabe complexity CEILING, set at 40: freezes the current worst
#          shipped function and blocks new giants. This is a regression
#          stop, not a target - do not grow functions toward it.
# N (pep8-naming) is deliberately NOT enabled: X/y/T/P math names are
# ML house style and the gRPC servicer method names are proto-mandated.
# No formatter adoption either - a reformat-everything diff would destroy
# git blame and review discipline.
extend-select = ["B", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 40

[tool.ruff.lint.per-file-ignores]
# config_guard.validate is ONE deliberate linear checklist (every config
# key gets its FATAL/WARN checks in sequence); C901 is waived here until
# it is split into per-section validators. Do not add new giants behind
# this waiver.
"core/config_guard.py" = ["C901"]
# The breadth bump (B) targets SHIPPED code; test files keep ruff
# defaults - their fixture-style zips/setattr are harness idiom, and
# rewriting them buys no production safety.
"tests/*" = ["B"]
# Offline operator/tuning scripts (outside the DoD ruff scope): waive the
# breadth-bump rules their harness style trips so the editor's on-save
# linter stays quiet; scripts/quant_trials.py + scripts/overfit_check.py
# ARE in the DoD scope and stay fully un-waived.
"scripts/gc_pusher.py" = ["C901"]
"scripts/sweep.py" = ["B905"]
"scripts/tune_search.py" = ["B905"]
# scripts/smoke_test.py is a dense offline test harness (200+ checks) that
# uses intentional compact one-liners - `ch.send("pause"); ch.send(...)`,
# `mm.maybe_poll(t); t += 1` - and a couple of deliberately-local imports.
# It is already OUTSIDE the Definition-of-Done ruff scope; this stops the
# editor's on-save linter from flagging that harness style as errors while
# every shipped engine/library path stays on ruff defaults, unignored.
"scripts/smoke_test.py" = ["E702", "E401", "E402", "B007"]

[tool.bandit]
# B101 (assert_used) is skipped repo-wide. Every assert in the tree is either a
# test-harness check (scripts/smoke_test.py, scripts/assurance_check.py) or a
# type-narrowing invariant guard in library code (e.g. `assert x is not None`
# after an init/fit step, to satisfy Pylance/pyright). None validate untrusted
# input, so `python -O` stripping them is harmless. Other bandit findings stay
# curated inline via `# nosec B<id>` markers, not blanket-skipped here.
skips = ["B101"]
# exclude_dirs lives in CONFIG, not only in the battery's `-x` flag, so a
# git worktree can never turn the battery red. `.worktrees/<name>/` holds a
# full second checkout INCLUDING its own tests/, and the documented
# `-x ./.venv,./tests` is a literal prefix match that does not reach
# `./.worktrees/x/tests` — so merely having a worktree open (e.g. to run one
# test against another commit, which is exactly how the 2026-07-26 Windows
# pin failure was diagnosed) added 75 phantom findings to a clean tree. A
# throwaway checkout must never be able to block a deploy.
exclude_dirs = [".venv", "tests", ".worktrees"]
