# Dashboard server hardening. Streamlit's DEFAULT bind is all interfaces
# (0.0.0.0): anyone on the LAN could reach the operator dashboard, which
# carries stop/pause/flatten controls and the live-ARM input. Loopback
# only - remote operation is deliberately unsupported.
[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false
