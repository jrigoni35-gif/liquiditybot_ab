# Grafana alert rule — DEAD-MAN: "telemetry dark" (the alert that survives
# total local death).
#
# Repo mirror, written 2026-08-17. The RULE ALREADY EXISTS LIVE on
# https://goldsavanna1216.grafana.net — uid `lb-telemetry-stale`, created
# via API 2026-07-14T01:58:05Z, folder "liquiditybot" (folderUID
# liquiditybot-ops), group "liquiditybot", interval 60s — but was never
# mirrored into docs/grafana/. This file closes that gap. Do NOT re-POST it
# as a new rule; the only piece of this file NOT live yet is the
# `notification_settings` block (see MANUAL-APPLY below).
#
# ── What it covers (all three local-death shapes) ───────────────────────────
#   1. runner frozen, pusher alive  → liquiditybot_status_age_sec climbs
#      past 180 → threshold C fires (status.json not written >3 min).
#   2. status.json missing/unreadable → gc_pusher.collect() takes the
#      OSError path (scripts/gc_pusher.py:263-267) which emits
#      status_missing/running/stale but NOT status_age_sec → the query
#      returns no series → noDataState: Alerting fires.
#   3. pusher/box dead (the 2026-08-16 job-object teardown shape) → ALL
#      series stop → no data → noDataState: Alerting fires.
#   Time-to-page ≈ 10-11 min after the last push: instant query + Prometheus
#   5m lookback empties the vector ~5m after death, then `for: 5m`, then
#   ≤60s eval. Observed live: 2026-08-16 21:42:10Z Pending(NoData) →
#   21:47:10Z Alerting.
#
#   If this rule is ever rebuilt from scratch, the strictly-always-on metric
#   is `liquiditybot_running` — emitted on every collect() path including
#   missing (gc_pusher.py:266), stale (:290), normal (:330), malformed
#   (:1008), and pinned in _ALWAYS_ON (scripts/build_trading_dashboard.py:1757).
#   status_age_sec skips path 2 above, but noData catches that path anyway,
#   so coverage is complete as-is.
#
# ── DELIVERY DEFECT: found 2026-08-17, FIXED 2026-08-30 ─────────────────────
# The live notification policy's ROOT receiver is "empty" — a receiver with
# ZERO integrations — and this rule (plus lb-manip-high) had
# notification_settings: null, so every firing routed to the void. State
# history (as read 2026-08-17T12:05Z): the rule reached Alerting(NoData) at
# 2026-08-16 02:46, 15:28, 21:47, 22:47, 23:28 and 2026-08-17 01:28
# (cleared 10:35Z) — six firings, zero pages. The rule was never broken;
# its delivery was, from creation (2026-07-14T01:58:05Z) through the fix.
#
# APPLIED 2026-08-30T22:05:24Z (re-derive: GET this rule and read
# `notification_settings`, or GET .../lb-manip-high — both carry it):
# read-modify-write PUT set `notification_settings: {receiver:
# grafana-default-email}` on both lb-telemetry-stale and lb-manip-high
# (verified live, GET confirms the field on both after the PUT). Root
# policy receiver is STILL "empty" — untouched, wider blast radius than
# needed — this per-rule override is what now delivers. The two new rules
# below (lb-drift-stuck, lb-brier-degraded) were PROVISIONED WITH this
# setting already attached, so they never carried the defect.
#
# Recipe, for the next rule that needs it:
#   GET  /api/v1/provisioning/alert-rules/<uid>
#   ... set "notification_settings": {"receiver": "grafana-default-email"},
#       drop response-only fields id/updated/provenance/record ...
#   PUT  /api/v1/provisioning/alert-rules/<uid>
#   Auth: Bearer token from ~/.liquiditybot/grafana-sa-token (read the file
#   into the header in-script; never argv, never echo).
#
# ── Injection test (schedule separately; DO NOT run casually — it pages) ────
#   1. Stop the pusher: Get-Process | Where CommandLine -match gc_pusher |
#      Stop-Process  (or stop its wrapper task). Leave it DEAD ≥ 12 min.
#   2. ~5-6 min in: rule state → Pending (NoData). ~10-11 min in: Alerting,
#      and an email to jrigoni35@gmail.com must arrive (subject carries
#      "liquiditybot telemetry stale or down").
#   3. Restart the pusher; the alert must self-resolve within ~2 evals
#      (observed live: Alerting → Normal in 1-3 min once data returns).
#   Alternative injection for shape 1 only: suspend the RUNNER but leave the
#   pusher up — age climbs past 180 and threshold C fires with data present.
#
# Datasource uid grafanacloud-prom = built-in Grafana Cloud Prometheus
# (confirmed live; `liquiditybot_running{job="liquiditybot"}` == 1 at
# 2026-08-17T12:04Z). File format matches liquiditybot_drift_alert.yaml /
# liquiditybot_brier_alert.yaml.
apiVersion: 1
groups:
  - orgId: 1
    name: liquiditybot                 # live ruleGroup (NOT liquiditybot-ml)
    folder: liquiditybot               # live folderUID: liquiditybot-ops
    interval: 1m
    rules:
      - uid: lb-telemetry-stale
        title: liquiditybot telemetry stale or down
        condition: C
        for: 5m                        # + ~5m Prometheus lookback before NoData ⇒ ~10-11m to page
        noDataState: Alerting          # pusher/box dead = THE event this alert exists for
        execErrState: Error            # live value; an exec-error still notifies (DatasourceError)
        labels:
          service: liquiditybot
        notification_settings:         # ← LIVE since 2026-08-30T22:05:24Z (see header)
          receiver: grafana-default-email
        annotations:
          summary: >-
            status.json has not been written for >3 min (runner frozen/dead)
            or the metrics pusher itself stopped reporting
        data:
          - refId: A                   # status.json age in seconds, instant
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: true
              expr: liquiditybot_status_age_sec{job="liquiditybot"}
          - refId: B                   # reduce to latest sample
            datasourceUid: __expr__
            model: {refId: B, type: reduce, reducer: last, expression: A}
          - refId: C                   # fire when the status file is >3 min old
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - type: query
                  evaluator: {type: gt, params: [180]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
