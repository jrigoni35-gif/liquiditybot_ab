# Grafana alert rule — "ML drift stuck high while the governor is degraded".
#
# Purpose: a TRANSIENT feature-drift blip (like ML-031 firing then clearing in
# minutes) must stay SILENT — the auto-retrain absorbs it. This rule pings ONLY
# when both hold together, continuously, for 30 minutes:
#
#     liquiditybot_ml_drift_share  > 0.30      (drift stays past the retrain-vote bar)
#   AND liquiditybot_monitor_level  > 0         (the ML kill-switch has actually degraded)
#
# i.e. the model is stuck on a regime it can't refit AND outcomes are hurting —
# not a passing regime shift. Both metrics are exported by scripts/gc_pusher.py.
#
# ── PROVISIONED 2026-08-30T22:xx — LIVE (ALERT-DRIFT closed) ────────────────
# POSTed to /api/v1/provisioning/alert-rules (folderUID liquiditybot-ops,
# ruleGroup liquiditybot-ml, interval 60s) with `notification_settings:
# {receiver: grafana-default-email}` attached from creation — this rule
# never carried the void-routing defect the deadman/manip rules had (see
# liquiditybot_deadman_alert.yaml's header for that history). Re-derive
# liveness: GET /api/v1/provisioning/alert-rules/lb-drift-stuck, or
# /api/prometheus/grafana/api/v1/rules (group "liquiditybot-ml").
#
# Root notification policy receiver is still "empty" (untouched, wider
# blast radius than needed) — this rule's per-rule notification_settings
# override is what actually delivers, same pattern as the other three.
apiVersion: 1
groups:
  - orgId: 1
    name: liquiditybot-ml
    folder: liquiditybot
    interval: 1m                       # evaluate every minute
    rules:
      - uid: lb-drift-stuck
        title: ML feature-drift stuck high while governor degraded
        condition: C
        for: 30m                       # must hold continuously for 30 min before firing
        noDataState: OK                # no samples (bot/pusher down) is NOT this alert's job
        execErrState: OK
        labels:
          severity: warning
          service: liquiditybot
        notification_settings:         # ← LIVE since provisioning, 2026-08-30
          receiver: grafana-default-email
        annotations:
          summary: >-
            Feature drift has stayed above 30% for 30m while the ML governor is
            degraded/killed. The model may be stuck on a regime it cannot refit —
            check Brier trend and retrain history on the incidents dashboard.
        data:
          - refId: A                   # drift share, last 10 min
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: A
              instant: false
              expr: max(liquiditybot_ml_drift_share{job="liquiditybot"})
          - refId: B                   # governor kill-switch level, last 10 min
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: grafanacloud-prom
            model:
              refId: B
              instant: false
              expr: max(liquiditybot_monitor_level{job="liquiditybot"})
          - refId: RA                  # reduce drift to its latest value
            datasourceUid: __expr__
            model: {refId: RA, type: reduce, reducer: last, expression: A}
          - refId: RB                  # reduce level to its latest value
            datasourceUid: __expr__
            model: {refId: RB, type: reduce, reducer: last, expression: B}
          - refId: C                   # fire when BOTH conditions hold (1) else 0
            datasourceUid: __expr__
            model: {refId: C, type: math, expression: "$RA > 0.3 && $RB > 0"}
